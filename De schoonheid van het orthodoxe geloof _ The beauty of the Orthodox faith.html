[["De Moeder Gods","The Mother of God"],["De letters ΜΡ ΘΥ staan voor «Moeder van God» (Theotokos). De drie sterren op de mantel, op voorhoofd en schouders, drukken volgens de traditie haar maagdelijkheid voor, tijdens en na de geboorte uit.","The letters ΜΡ ΘΥ abbreviate “Mother of God” (Theotokos). The three stars on the mantle, on the forehead and shoulders, express, according to tradition, her virginity before, during and after the birth."],'<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" '+G+'/><text x="60" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#e8c978">ΜΡ ΘΥ</text><path d="M60 62l3 7h7l-6 5 2 7-6-4-6 4 2-7-6-5h7zM38 74l2 4h4l-3 3 1 4-4-2-4 2 1-4-3-3h4zM82 74l2 4h4l-3 3 1 4-4-2-4 2 1-4-3-3h4z" fill="#e8c978" stroke="none"/></svg>'],
[["De vis (Ichthys)","The fish (Ichthys)"],["Ἰχθύς, «vis», was een acrostichon van de eerste christenen: Jezus Christus, Zoon van God, Verlosser. Een van de oudste symbolen van het christendom.","Ἰχθύς, “fish”, was an acrostic of the early Christians: Jesus Christ, Son of God, Saviour. One of the oldest symbols of Christianity."],'<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" '+G+'/><path d="M24 60Q50 32 84 60Q50 88 24 60ZM84 60L100 44V76Z" '+G+'/><circle cx="40" cy="56" r="3" fill="#e8c978"/></svg>']];
/* ---------- render ---------- */
var tl=$('#tl'),ar=$('#ar'),ic=$('#ic'),tb=$('#tabs'),pn=$('#panel'),dlg=$('#dlg'),ti=0,first=true,io;
function pick(a){return a[L]}
function build(){
tl.innerHTML='';EV.forEach(function(e){var d=document.createElement('div');d.className='ev rv';d.innerHTML='<b>'+e[0]+'</b><h3 style="margin:0">'+pick(e[1])+'</h3><p>'+pick(e[2])+'</p>';tl.appendChild(d)});
ar.innerHTML='';AR.forEach(function(a){var c=document.createElement('article');c.className='card';c.innerHTML='<h3>'+pick(a[0])+'</h3><small>'+pick(a[1])+'</small><p style="margin-top:.6rem">'+pick(a[2])+'</p>';ar.appendChild(c)});
ic.innerHTML='';SY.forEach(function(s){var b=document.createElement('button');b.className='card';b.innerHTML='<span class="med">'+s[2]+'</span><h3 style="text-align:center">'+pick(s[0])+'</h3><p style="text-align:center">'+pick(s[1]).split('. ')[0]+'.</p>';
b.onclick=function(){$('#dc').innerHTML=s[2];$('#dtx').textContent=pick(s[0])+'. '+pick(s[1]);dlg.showModal()};ic.appendChild(b)});
tb.innerHTML='';TR.forEach(function(t,i){var b=document.createElement('button');b.role='tab';b.textContent=pick(t[0]);b.setAttribute('aria-selected',i==ti);b.onclick=function(){ti=i;build()};tb.appendChild(b)});
pn.innerHTML='<h3>'+pick(TR[ti][0])+'</h3><p>'+pick(TR[ti][1])+'</p>';
document.querySelectorAll('.rv').forEach(function(e){if(first)io.observe(e);else e.classList.add('on')});
}
function apply(){
document.documentElement.lang=L?'en':'nl';
document.querySelectorAll('[data-t]').forEach(function(e){e.innerHTML=pick(S[e.dataset.t])});
document.querySelectorAll('[data-al]').forEach(function(e){e.setAttribute('aria-label',pick(S[e.dataset.al]))});
document.title=pick(S.h1);
$('meta[name=description]').setAttribute('content',L?'History, icons, architecture and traditions of the Orthodox Church, with an interactive 3D church.':'Geschiedenis, iconen, architectuur en tradities van de Orthodoxe Kerk, met een interactieve 3D-kerk.');
document.querySelectorAll('.lg button').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.l===L)});
$('#burger').textContent='Menu'}
io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}})},{threshold:.15});
apply();build();first=false;
document.querySelectorAll('.lg button').forEach(function(b){b.onclick=function(){L=+b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}apply();build()}});
$('#hf').innerHTML='<svg viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e8c978"/><stop offset="1" stop-color="#a47f2f"/></linearGradient><radialGradient id="s" cx=".5" cy=".75" r=".7"><stop offset="0" stop-color="#e8a548" stop-opacity=".6"/><stop offset="1" stop-color="#0b1230" stop-opacity="0"/></radialGradient></defs><rect width="300" height="400" fill="#0b1230"/><rect width="300" height="400" fill="url(#s)"/><g fill="url(#g)"><rect x="90" y="250" width="120" height="110"/><rect x="132" y="200" width="36" height="55"/><path d="M150 120c-26 28-24 58 0 78 24-20 26-50 0-78z"/><path d="M96 238c-14 14-13 30 0 40 13-10 14-26 0-40zM204 238c-14 14-13 30 0 40 13-10 14-26 0-40z"/><path d="M150 96v28M141 108h18" stroke="url(#g)" stroke-width="3"/><rect x="60" y="360" width="180" height="10"/></g><g fill="#0b1230"><path d="M140 360v-34a10 10 0 0120 0v34z"/><rect x="104" y="290" width="12" height="22" rx="6"/><rect x="184" y="290" width="12" height="22" rx="6"/></g></svg>';
$('#dx').onclick=function(){dlg.close()};dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
var bg=$('#burger'),mn=$('#menu');bg.onclick=function(){var o=mn.classList.toggle('open');bg.setAttribute('aria-expanded',o)};
mn.addEventListener('click',function(){mn.classList.remove('open');bg.setAttribute('aria-expanded',false)});
if(!RM){document.addEventListener('pointermove',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c)return;var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='rotateY('+x*14+'deg) rotateX('+-y*14+'deg)'});
document.addEventListener('pointerout',function(e){var c=e.target.closest&&e.target.closest('.card');if(c)c.style.transform=''})}
/* ---------- Three.js ---------- */
var cv=$('#gl'),ok=false,R;
try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});ok=!!R.getContext()}catch(e){}
if(!ok||typeof THREE==='undefined'){cv.style.display='none';$('#fallback').style.display='block';return}
var mob=innerWidth<820;R.setPixelRatio(Math.min(devicePixelRatio,mob?1.3:2));
var sc=new THREE.Scene();sc.fog=new THREE.FogExp2(0x0b1230,.045);
var cam=new THREE.PerspectiveCamera(42,1,.1,100);
var gold=new THREE.MeshStandardMaterial({color:0xd4a843,metalness:.85,roughness:.3});
var wall=new THREE.MeshStandardMaterial({color:0xe9dfc8,roughness:.8});
var dark=new THREE.MeshStandardMaterial({color:0x2a2f55,roughness:.7});
var ch=new THREE.Group();
function box(w,h,d,x,y,z,m){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||wall);o.position.set(x,y,z);ch.add(o);return o}
function dome(r,x,y,z){var pts=[];for(var i=0;i<=16;i++){var t=i/16,rr=r*Math.sin(Math.PI*Math.pow(t,.8))*(t<.55?1:1-(t-.55)*.9);pts.push(new THREE.Vector2(Math.max(rr,.001),t*r*2.4))}
var m=new THREE.Mesh(new THREE.LatheGeometry(pts,mob?18:32),gold);m.position.set(x,y,z);ch.add(m);
var c=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.4),gold);c.position.set(x,y+r*2.4+.15,z);ch.add(c);
var c2=new THREE.Mesh(new THREE.BoxGeometry(.2,.015,.015),gold);c2.position.set(x,y+r*2.4+.25,z);ch.add(c2)}
box(3.4,1.6,2.4,0,.8,0);box(1.1,1.5,1.1,0,2.3,0);
[[-1.5,-1],[1.5,-1],[-1.5,1],[1.5,1]].forEach(function(p){box(.7,1.2,.7,p[0],2.2,p[1]*.7);dome(.34,p[0],2.8,p[1]*.7)});
dome(.62,0,3.05,0);box(1.2,.9,1.2,0,.45,1.7);
for(var i=-3;i<=3;i++)box(.18,.6,.05,i*.4,1.05,1.22,dark);
[-1,0,1].forEach(function(i){box(.35,.7,.05,i*.9,.55,1.22,dark)});
ch.position.y=-.9;sc.add(ch);
var gr=new THREE.Mesh(new THREE.CircleGeometry(14,48),new THREE.MeshStandardMaterial({color:0x10142a,roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.y=-.9;sc.add(gr);
sc.add(new THREE.HemisphereLight(0x5b6fc0,0x120c05,.7));
var key=new THREE.PointLight(0xffb15a,2.2,18);key.position.set(2,3,4.5);sc.add(key);
var rim=new THREE.DirectionalLight(0x7f94ff,.8);rim.position.set(-4,4,-3);sc.add(rim);
var N=mob?120:300,pg=new THREE.BufferGeometry(),pa=new Float32Array(N*3);
for(var k=0;k<N;k++){pa[k*3]=(Math.random()-.5)*14;pa[k*3+1]=Math.random()*7-1;pa[k*3+2]=(Math.random()-.5)*10}
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf2c673,size:.05,transparent:true,opacity:.75}));sc.add(pts);
var mx=0,my=0,vis=true,t0=performance.now();
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function size(){var w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
ch.position.x=w>h&&!mob?2.2:0;ch.scale.setScalar(mob?.85:1)}
addEventListener('resize',function(){size();if(RM)draw(0)});size();
new IntersectionObserver(function(e){vis=e[0].isIntersecting}).observe($('#hero'));
function draw(t){var s=RM?0:t*.001;
cam.position.set(Math.sin(s*.15)*1.2+mx*1.6,2.2-my*.8+(RM?0:Math.sin(s*.2)*.2),mob?10.5:8.2);cam.lookAt(ch.position.x*.7,1.4,0);
key.intensity=2.1+(RM?0:Math.sin(s*7)*.12+Math.sin(s*3.1)*.08);
if(!RM)pts.rotation.y=s*.02;R.render(sc,cam)}
function loop(){requestAnimationFrame(loop);if(vis)draw(performance.now()-t0)}
if(RM)draw(0);else loop();
})();
</script>
